version: '3.8'

services:
  # 1. PostgreSQL 16 High-Throughput Relational Storage
  postgres:
    image: postgres:16-alpine
    container_name: hot-recharge-postgres
    restart: always
    environment:
      POSTGRES_USER: hot_user
      POSTGRES_PASSWORD: hot_secure_password_au2026
      POSTGRES_DB: hot_recharge_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hot_user -d hot_recharge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 In-Memory Cache & Mutex
  redis:
    image: redis:7-alpine
    container_name: hot-recharge-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # 3. HOT Recharge Express Gateway
  api-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hot-recharge-api-gateway
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://hot_user:hot_secure_password_au2026@postgres:5432/hot_recharge_db
      - REDIS_URL=redis://redis:6379
      - HOT_RECHARGE_BASE_URL=https://ssl.hot.co.zw/api/v3/
      - ZIMRA_DEVICE_ID=FDMS-HRE-0091
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
